[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eidos-hyle-tt"
version = "0.1.0"
description = "Physics- and physiology-based time trial strategy optimizer for serious amateur racers"
readme = "README.md"
authors = [{ name = "Sato SAGA" }]
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "fit-tool==0.9.15",
    "matplotlib==3.10.7",
    "numba==0.62.1",
    "numpy==2.3.4",
    "openant==1.3.4",
    "opencv-python==4.13.0.90",
    "pandas==2.3.3",
    "pyarrow==25.0.0",
    "pyautogui==0.9.54",
    "PyOpenGL==3.1.10",
    "PyOpenGL-accelerate==3.1.10",
    "PySide6==6.10.1",
    "pydantic==2.12.5",
    "pytesseract==0.3.13",
    "reportlab==4.4.10",
    "SALib==1.5.2",
    "scikit-learn==1.9.0",
    "scipy==1.16.3",
    "tkinterdnd2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10", "pre-commit>=4"]
docs = ["sphinx>=7"]
lint = ["interrogate>=1.7", "ruff>=0.16"]

[project.scripts]
eidos-manager          = "eidos.apps.manager:main"
eidos-generator        = "eidos.apps.generator:main"
eidos-viewer           = "eidos.apps.viewer:main"
eidos-designer         = "eidos.apps.designer:main"
eidos-exporter         = "eidos.apps.exporter:main"
eidos-trainer          = "eidos.apps.trainer:main"
eidos-navigator        = "eidos.apps.navigator:main"
eidos-analyzer         = "eidos.apps.analyzer:main"
hyle-course-checker    = "hyle.apps.course_checker:main"
hyle-cpmodel-estimator = "hyle.apps.cpmodel_estimator:main"
hyle-fit2gpx-converter = "hyle.apps.fit2gpx_converter:main"
hyle-fit-combiner      = "hyle.apps.fit_combiner:main"
hyle-strategy-doctor   = "hyle.apps.strategy_doctor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hyle.apps.course_checker" = ["*.html"]
"hyle.apps.cpmodel_estimator" = ["*.html"]
"hyle.apps.fit2gpx_converter" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Coverage is diagnostic here, not a quality gate: tests/ is deliberately
# narrow (entry-point wiring + a couple of pinned regressions -- see
# docs/ARCHITECTURE.md's "Testing philosophy"), not a general-purpose
# suite over core.simulators/the optimizer's physics. A fail-under would
# either be trivially low (meaningless) or pressure someone into adding
# tests of the golden-case kind that section explicitly rejects. Run
# with `pytest --cov` (see docs/RUNBOOK.md) to see what the existing
# tests actually exercise, not to chase a number.
[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
skip_empty = true

# --- Gradual-adoption starting point ------------------------------------
# The codebase predates type hints in most places, so this intentionally
# starts lenient (ignore_missing_imports for third-party libs without
# stubs, no disallow_untyped_defs) rather than strict. Tighten
# incrementally -- e.g. drop ignore_missing_imports per-package once
# stubs exist, add disallow_untyped_defs on a module-by-module basis --
# rather than flipping everything to strict at once.
[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
show_error_codes = true
exclude = [
    "^backup20260",
    "^env312_arm64/",
    "^temp/",
]

# --- Gradual-adoption starting point ------------------------------------
# fail-under is a floor against regressions, not a target to chase with
# busywork docstrings on every last helper -- this codebase mostly
# documents __init__ methods/modules/magic methods at the class level
# instead, hence they're excluded below rather than counted against the
# floor. Run: see docs/RUNBOOK.md.
[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
fail-under = 85

[tool.ruff]
target-version = "py312"

# --- Gradual-adoption starting point ------------------------------------
# Same philosophy as [tool.mypy]/[tool.interrogate]: start with the rules
# that catch real bugs (pyflakes) plus import sorting, not a full
# stylistic rewrite of the whole codebase in one sitting. E701/E702
# (multiple statements per line) are pervasive existing style spread
# across 16 files (134 occurrences total; designer.py/view_opengl.py
# are the two biggest at 50/15 but together still under half) -- a
# deliberate future decision, not something implied by turning the
# linter on.
# Broader rule sets (B, UP, SIM, ...) can be added
# incrementally later, the same way mypy's strictness is being
# tightened package by package.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E701", "E702"]

[tool.ruff.lint.per-file-ignores]
# PyOpenGL's own conventional usage is `from OpenGL.GL import *` -- its
# functions (glBegin, glVertex3f, ...) are meant to be used unprefixed;
# that's the library's idiom, not an accident worth flagging file-wide.
"src/eidos/apps/trainer.py" = ["F403", "F405"]
"src/eidos/lib/view_opengl.py" = ["F403", "F405"]
